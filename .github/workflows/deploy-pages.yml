name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site/Images _site/vendor/three
          cp index.html style.css script.js pet-3d.js portfolio-data.js CV_HOANGVANTHIEN.pdf favicon.svg robots.txt sitemap.xml _site/
          cp Images/ProfileImage.png Images/ProfileImage1.png Images/ConstructionPaymentRequest.jpg _site/Images/
          cp vendor/three/three.module.js vendor/three/three.core.js vendor/three/OrbitControls.js vendor/three/LICENSE _site/vendor/three/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
